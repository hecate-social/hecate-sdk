<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="system-ui, -apple-system, sans-serif" font-size="14">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="380" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Plugin Lifecycle (In-VM)</text>

  <!-- Command flow (top row) -->
  <text x="400" y="60" text-anchor="middle" font-size="12" fill="#64748b">Command Flow</text>

  <!-- Install box -->
  <rect x="30" y="80" width="120" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="90" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">install</text>
  <text x="90" y="116" text-anchor="middle" font-size="10" fill="#3b82f6">plugin_v1</text>

  <!-- Arrow -->
  <line x1="150" y1="105" x2="185" y2="105" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Extract box -->
  <rect x="190" y="80" width="120" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="250" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">extract</text>
  <text x="250" y="116" text-anchor="middle" font-size="10" fill="#3b82f6">package_v1</text>

  <!-- Arrow -->
  <line x1="310" y1="105" x2="345" y2="105" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Activate box -->
  <rect x="350" y="80" width="120" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="410" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">activate</text>
  <text x="410" y="116" text-anchor="middle" font-size="10" fill="#3b82f6">plugin_v1</text>

  <!-- Arrow -->
  <line x1="470" y1="105" x2="505" y2="105" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Load box (different color - side effect) -->
  <rect x="510" y="80" width="120" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="570" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">load_plugin</text>
  <text x="570" y="116" text-anchor="middle" font-size="10" fill="#b45309">(side effect)</text>

  <!-- Arrow -->
  <line x1="630" y1="105" x2="655" y2="105" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Confirm box -->
  <rect x="660" y="80" width="120" height="50" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="720" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">confirm</text>
  <text x="720" y="116" text-anchor="middle" font-size="10" fill="#16a34a">loaded_v1</text>

  <!-- Event flow (middle row) -->
  <text x="400" y="170" text-anchor="middle" font-size="12" fill="#64748b">Events Emitted</text>

  <!-- Event boxes -->
  <rect x="30" y="185" width="130" height="40" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="95" y="208" text-anchor="middle" font-size="10" fill="#475569">plugin_installed_v1</text>

  <rect x="190" y="185" width="145" height="40" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="262" y="208" text-anchor="middle" font-size="10" fill="#475569">package_extracted_v1</text>

  <rect x="365" y="185" width="130" height="40" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="430" y="208" text-anchor="middle" font-size="10" fill="#475569">plugin_activated_v1</text>

  <rect x="660" y="185" width="120" height="40" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="720" y="208" text-anchor="middle" font-size="10" fill="#475569">plugin_loaded_v1</text>

  <!-- Vertical arrows from commands to events -->
  <line x1="90" y1="130" x2="90" y2="183" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowhead)"/>
  <line x1="250" y1="130" x2="258" y2="183" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowhead)"/>
  <line x1="410" y1="130" x2="420" y2="183" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowhead)"/>
  <line x1="720" y1="130" x2="720" y2="183" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowhead)"/>

  <!-- Process Managers (bottom row) -->
  <text x="400" y="260" text-anchor="middle" font-size="12" fill="#64748b">Process Managers (react to events, dispatch next command)</text>

  <!-- PM boxes -->
  <rect x="50" y="275" width="165" height="40" rx="4" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/>
  <text x="132" y="292" text-anchor="middle" font-size="9" font-weight="600" fill="#6d28d9">on_installed</text>
  <text x="132" y="304" text-anchor="middle" font-size="9" fill="#7c3aed">extract_package</text>

  <rect x="240" y="275" width="165" height="40" rx="4" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/>
  <text x="322" y="292" text-anchor="middle" font-size="9" font-weight="600" fill="#6d28d9">on_extracted</text>
  <text x="322" y="304" text-anchor="middle" font-size="9" fill="#7c3aed">activate_plugin</text>

  <rect x="430" y="275" width="165" height="40" rx="4" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/>
  <text x="512" y="292" text-anchor="middle" font-size="9" font-weight="600" fill="#6d28d9">on_activated</text>
  <text x="512" y="304" text-anchor="middle" font-size="9" fill="#7c3aed">load_plugin</text>

  <!-- Curved arrows from events to PMs -->
  <path d="M 95 225 C 95 250, 132 250, 132 273" stroke="#8b5cf6" stroke-width="1.2" fill="none" marker-end="url(#arrowhead-blue)"/>
  <path d="M 262 225 C 262 250, 322 250, 322 273" stroke="#8b5cf6" stroke-width="1.2" fill="none" marker-end="url(#arrowhead-blue)"/>
  <path d="M 430 225 C 430 250, 512 250, 512 273" stroke="#8b5cf6" stroke-width="1.2" fill="none" marker-end="url(#arrowhead-blue)"/>

  <!-- Legend -->
  <rect x="30" y="335" width="740" height="35" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="45" y="345" width="16" height="16" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="67" y="357" font-size="10" fill="#475569">Command</text>
  <rect x="135" y="345" width="16" height="16" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="157" y="357" font-size="10" fill="#475569">Event</text>
  <rect x="210" y="345" width="16" height="16" rx="3" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/>
  <text x="232" y="357" font-size="10" fill="#475569">Process Manager</text>
  <rect x="345" y="345" width="16" height="16" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="367" y="357" font-size="10" fill="#475569">Side Effect</text>
  <rect x="455" y="345" width="16" height="16" rx="3" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="477" y="357" font-size="10" fill="#475569">Confirmation</text>
</svg>
